name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Rafeeq.FE/rafeeq-web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rafeeq.FE/rafeeq-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Project page lives at /Rafeeq/ ; copy index.html -> 404.html so client-side routes resolve.
      - run: npx ng build --configuration production --base-href /Rafeeq/
      - run: cp dist/rafeeq-web/browser/index.html dist/rafeeq-web/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Rafeeq.FE/rafeeq-web/dist/rafeeq-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
