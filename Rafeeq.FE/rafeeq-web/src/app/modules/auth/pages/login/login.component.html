<div class="bg-surface rounded-xl shadow-sm border border-line p-7">
  <h2 class="text-2xl font-extrabold text-ink mb-1">{{ 'auth.loginTitle' | translate }}</h2>
  <p class="text-muted mb-6">{{ 'auth.loginSubtitle' | translate }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-ink req">{{ 'fields.email' | translate }}</label>
      <input pInputText type="email" formControlName="email" class="w-full ltr-nums" autocomplete="email" />
      <small class="text-error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
        {{ 'validation.email' | translate }}
      </small>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-ink req">{{ 'fields.password' | translate }}</label>
      <p-password
        formControlName="password"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="w-full"
        inputStyleClass="w-full"
      ></p-password>
      <small class="text-error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
        {{ 'validation.required' | translate }}
      </small>
    </div>

    <button
      pButton
      type="submit"
      [label]="'auth.submitLogin' | translate"
      [loading]="loading"
      class="w-full mt-2"
    ></button>
  </form>

  <p class="text-center text-sm mt-3">
    <a routerLink="/auth/forgot-password" class="text-muted hover:text-brand">
      {{ 'auth.forgotLink' | translate }}
    </a>
  </p>

  <p class="text-center text-sm text-muted mt-5">
    {{ 'auth.noAccount' | translate }}
    <a routerLink="/auth/register" class="text-brand font-semibold">{{ 'nav.register' | translate }}</a>
  </p>
</div>
